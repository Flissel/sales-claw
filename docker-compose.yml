# Lokaler Betrieb auf Docker Desktop. Für die Proxmox-VM zusätzlich
# docker-compose.proxmox.yml als Override verwenden (siehe docs/07).
#
# Projektname explizit gepinnt (Stufe 3, T3). Er war bisher implizit vom
# Verzeichnisnamen abgeleitet — und genau daran hängt mehr, als man sieht:
# docker-compose.openwa.yml liegt im selben Verzeichnis und bekommt damit
# denselben Projektnamen, also auch dasselbe Default-Netz
# "sales-claw_default". Gemessen (docker inspect): openwa, sales-mcp und
# sales-claw hängen alle dort, openwa ist unter dem DNS-Namen `openwa`
# erreichbar. Deshalb braucht der Dispatcher KEIN zusätzliches externes Netz
# — und niemand muss dafür einen laufenden Container neu erzeugen. Würde das
# Verzeichnis umbenannt, fiele diese Kopplung stillschweigend auseinander;
# der explizite Name hier und in docker-compose.openwa.yml hält sie fest.
name: sales-claw

services:
  sales-claw:
    image: ghcr.io/openclaw/openclaw:2026.7.1-slim
    container_name: sales-claw
    # DEMO-BETRIEB: bewusst "no", nicht "unless-stopped".
    #
    # Der Container hängt an der persönlichen WhatsApp-Nummer des Betreibers
    # und `channels.whatsapp.selfChatMode` steht auf true — er beantwortet
    # also jede Nachricht, die der Betreiber sich selbst schreibt. Das ist für
    # die Vorführung gewollt, im Alltag aber unerwünscht: der Selbst-Chat
    # dient vielen als Notizzettel, und jede Notiz bekäme eine Antwort.
    #
    # Mit "no" läuft der Container nur, solange er ausdrücklich gestartet
    # wurde, und ist nach einem Neustart des Rechners wieder aus.
    #
    # Auf "unless-stopped" umstellen, sobald sales-claw eine eigene Nummer hat
    # und dauerhaft bedienen soll. Voraussetzung dafür bleibt, dass der
    # Anmelde-Trigger der Windows-Aufgabe \OpenClaw Gateway deaktiviert ist
    # (aktuell: Enabled=False) — sonst kämen bei einer Anmeldung zwei
    # Baileys-Sitzungen auf denselben Credentials hoch.
    restart: unless-stopped
    # KEIN env_file: .env — bewusst, und bewusst nicht bequem (Stufe 3, T5a).
    #
    # `.env` enthält OPENWA_API_KEY und SALES_DB_URL. Über `env_file: .env`
    # erbte der Agent-Container beide, obwohl er beide nicht braucht: er
    # versendet nichts (das tut ausschliesslich sales-dispatch) und spricht
    # die Datenbank nur über sales-mcp an. Geerbt bekam er damit die
    # Fähigkeit, das Freigabe-Gate zu umgehen — ein `curl` gegen OpenWA
    # sendet WhatsApp-Nachrichten ohne jeden Umweg über `drafts`, ein `psql`
    # mit der DSN setzt `status='approved'` selbst. Das Gate soll die
    # Datenbank sein (Grundsatzentscheidung 1); mit den Schlüsseln im
    # Agent-Container ist es nur noch so stark wie die Exec-Freigabeliste des
    # Gateways. Eine Zeitbombe, weil sie erst beim nächsten regulären
    # Recreate scharf wird — der laufende Container hat die Variablen aus
    # seinem Erzeugungszeitpunkt, sichtbar wird die Änderung also erst dann.
    #
    # Deshalb hier eine ausdrückliche Liste statt einer Vererbung: was der
    # Agent braucht, steht namentlich da. Kommt etwas dazu, muss es jemand
    # hinschreiben — und dabei kurz überlegen, ob es hier hingehört.
    # Die Werte kommen weiterhin aus `.env`, aber über Compose-Interpolation
    # (`${...}`), die nur die genannten Namen auflöst.
    #
    # sales-mcp und sales-dispatch behalten `env_file: .env`: sie SIND die
    # Vertrauensdomäne für diese Geheimnisse — der eine hält die Kundendaten-DB,
    # der andere ist die einzige Komponente, die versenden darf.
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TZ=${TZ:-Europe/Berlin}
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
    volumes:
      - sales-claw-state:/home/node/.openclaw
      - sales-claw-keys:/home/node/.config/openclaw
    ports:
      # Nur Loopback. Der Gateway hält WhatsApp-Session und Modellschlüssel.
      - "127.0.0.1:18894:18894"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "openclaw", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  sales-mcp:
    build: ./sales-mcp
    # Expliziter Tag statt des impliziten "sales-claw-sales-mcp": sales-dispatch
    # unten faehrt DASSELBE Image (siehe dort). Damit genuegt weiterhin ein
    # `docker compose build sales-mcp`, um beide Dienste aktuell zu halten.
    image: sales-claw-sales-mcp:local
    container_name: sales-mcp
    # Wie sales-claw im Demo-Betrieb: laeuft nur nach ausdruecklichem Start.
    restart: unless-stopped
    env_file:
      - .env
    # Der Medienordner (Stufe 4, F4). Hier liegen die Unterlagen, die der
    # Betreiber an Entwürfe hängen kann; `medien_liste` liest genau dieses
    # Verzeichnis und `entwurf_erstellen` prüft eine Datei gegen es, bevor ein
    # Entwurf entsteht.
    #
    # `:ro` ist nicht Vorsicht, sondern Aussage: weder Werkzeugdienst noch
    # Dispatcher haben je einen Grund, in diesen Ordner zu schreiben. Was
    # versendet werden kann, legt ausschliesslich ein Mensch auf dem Host ab.
    # Ein Host-Bind statt eines benannten Volumes, weil genau das der Weg ist,
    # auf dem der Betreiber Dateien hineinbekommt (Datei-Explorer, nicht
    # `docker cp`).
    #
    # Der Reportordner (Stufe 5, R1) — und das einzige beschreibbare Bind im
    # ganzen Stack. `marktanalyse` legt hier ihre Markdown-Reports ab
    # (/reports/<thema>-<region>-<datum>.md).
    #
    # Warum überhaupt auf den Host und nicht in ein benanntes Volume: der
    # Report ist ein Arbeitsergebnis für einen Menschen. Er soll ihn im
    # Datei-Explorer öffnen, per Mail weiterreichen und aufheben können, ohne
    # `docker cp` zu lernen. Und er muss den Neustart eines Prototyp-Containers
    # ueberleben.
    #
    # Warum NUR an sales-mcp und warum schreibbar: nur der Werkzeugdienst
    # erzeugt Reports. Dispatcher und Inbox haben hier nichts zu suchen — der
    # eine versendet, der andere nimmt entgegen; ein Schreibrecht, das niemand
    # braucht, wird auch nicht vergeben. Der Medienordner darüber bleibt
    # unverändert `:ro`: was rausgehen kann, legt ausschliesslich ein Mensch ab
    # (Begründung dort) — die beiden Ordner haben genau gegenläufige
    # Datenrichtungen und deshalb gegenläufige Rechte.
    volumes:
      - ./media:/media:ro
      # media-erzeugt (01.09.2026): der EINZIGE Medienordner, in den das
      # System selbst schreibt — hierhin legt `termin_bestaetigen` die
      # Kalenderdatei, damit sie ohne Handgriff anhaengbar ist. Vorher lag
      # sie nur in reports/ und war damit erzeugt und unversendbar. Der
      # Menschen-Ordner darueber bleibt unveraendert :ro; die Versender
      # unten binden diesen hier ebenfalls nur lesend.
      - ./media-erzeugt:/media-erzeugt
      - ./reports:/reports
      # Sprachnachrichten NUR LESEN (01.09.2026): geschrieben wird dort
      # ausschliesslich von sales-inbox, gelesen zum Transkribieren.
      # Dieselbe gegenlaeufige Rechte-Logik wie oben.
      - sales-sprachnachrichten:/sprachnachrichten:ro
      # Auftrags-Spool (27.08.2026): update_anfordern() legt hier Auftraege
      # ab, der Waechter auf dem Wirt (deploy/auftrag-ausfuehren.sh) holt
      # sie und schreibt Ergebnisse zurueck. Schreibbar, gitignoriert.
      - ./auftraege:/auftraege
    # Kein ports:-Eintrag — nur im Compose-Netz erreichbar. Der Dienst kennt
    # die Kundendaten-DB; er hat auf dem Host nichts verloren.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Der Dispatcher — die einzige Komponente, die tatsaechlich versendet.
  # Gleicher Build-Kontext und gleiches Image wie sales-mcp, nur ein anderes
  # Kommando: er teilt sich mit server.py Pool, Query-Helfer und die
  # Schema-Whitelist (sales-mcp/dispatch.py).
  #
  # Er liest ausschliesslich drafts(status='approved', channel='whatsapp').
  # Das Freigabe-Gate ist die Datenbank, nicht das Verhalten eines Modells
  # (Grundsatzentscheidung 1); LinkedIn fasst er nie an (Nr. 3).
  sales-dispatch:
    build: ./sales-mcp
    image: sales-claw-sales-mcp:local
    container_name: sales-dispatch
    command: python dispatch.py
    # Demo-Betrieb wie der restliche Stack. Bewusst "no": ein Dienst, der
    # Nachrichten an echte Menschen schickt, startet nicht von selbst mit dem
    # Rechner mit.
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # openwa laeuft aus docker-compose.openwa.yml — dank gepinntem
      # Projektnamen (oben) im selben Netz und unter diesem DNS-Namen
      # erreichbar. Gemessen aus einem Container dieses Netzes:
      # GET http://openwa:2785/api/health/ready -> 200, /api/sessions ohne
      # Key -> 401.
      - OPENWA_URL=http://openwa:2785
      # Schleifentakt aus dem Plan (T3), explizit statt implizit per Default.
      - DISPATCH_INTERVAL_S=10
      # OPENWA_SESSION_ID und OPENWA_API_KEY kommen aus .env.
    # Derselbe Medienordner wie an sales-mcp, ebenfalls read-only (Begründung
    # dort). Der Dispatcher liest eine angehängte Datei unmittelbar vor dem
    # Senden erneut — sie kann seit der Freigabe verschwunden sein, und dann
    # scheitert der Entwurf, statt ohne Anhang rauszugehen.
    volumes:
      - ./media:/media:ro
      - ./media-erzeugt:/media-erzeugt:ro
    # Ein laufender Versand darf nicht per SIGKILL zerrissen werden: der
    # Dispatcher beendet nach SIGTERM die laufende Runde (HTTP-Timeout 30 s)
    # und geht dann. 45 s Gnadenfrist decken das ab.
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Der Eingang (Stufe 4, F1) — die Gegenrichtung des Dispatchers: OpenWA
  # stellt hier `message.received` der Session `sales` zu, jede angenommene
  # Nachricht wird zu einer `activities`-Zeile vom Typ `kundenantwort`.
  # Gleicher Build-Kontext und gleiches Image wie sales-mcp, nur ein anderes
  # Kommando (sales-mcp/inbox.py).
  #
  # Er ist der ERSTE von aussen erreichbare Endpunkt dieses Systems. Deshalb:
  #   * Jede Anfrage wird per HMAC-SHA256 gegen INBOX_WEBHOOK_SECRET geprueft,
  #     BEVOR irgendetwas geparst oder geschrieben wird (gemessenes Verfahren:
  #     openwa/upstream/src/modules/webhook/webhook-delivery.service.ts,
  #     Header `X-OpenWA-Signature`, Wert `sha256=<hex>` ueber den rohen Rumpf).
  #     Ohne gesetztes Geheimnis startet der Dienst nicht.
  #   * KEIN ports:-Eintrag. Erreichbar ist er ausschliesslich im Compose-Netz
  #     unter http://sales-inbox:8790/webhook — auf dem Host hat ein Endpunkt,
  #     der in die Kundendatenbank schreibt, nichts verloren.
  #   * Er versendet nichts und aendert keine `drafts`. Das Freigabe-Gate
  #     (Grundsatzentscheidung 1) bleibt unberuehrt.
  sales-inbox:
    build: ./sales-mcp
    image: sales-claw-sales-mcp:local
    container_name: sales-inbox
    command: python inbox.py
    # Demo-Betrieb wie der restliche Stack.
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Port im Compose-Netz, explizit statt implizit per Default.
      - INBOX_PORT=8790
      # INBOX_WEBHOOK_SECRET und INBOX_UNBEKANNT_LEAD_ID kommen aus .env.
      - SPRACH_DIR=/sprachnachrichten
    volumes:
      # Sprachnachrichten (01.09.2026): das Audio kommt inline im Webhook
      # und wird hier abgelegt — sales-mcp liest es zum Transkribieren.
      # Eigenes Volume statt media/: das ist Kundeninhalt, kein
      # Versandmaterial, und es soll nicht in der /medien-Ansicht landen.
      - sales-sprachnachrichten:/sprachnachrichten
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Der Zwilling des Dispatchers für den Kanal E-Mail (Stufe 9, G2).
  # Gleicher Build-Kontext, gleiches Image, nur ein anderes Kommando
  # (sales-mcp/mail_dispatch.py).
  #
  # Er liest ausschliesslich drafts(status='approved', channel='email') und
  # benutzt dieselben Claim-/Buchungshelfer wie sales-dispatch (Import, keine
  # Kopie). Das Freigabe-Gate ist auch hier die Datenbank
  # (Grundsatzentscheidung 1) — es gibt keinen Weg, auf dem eine E-Mail ohne
  # `approved` hinausgeht.
  #
  # KEIN volumes:-Eintrag, und das ist eine Aussage: dieser Dienst versendet
  # reinen Text. Er hat im Medienordner nichts zu suchen, und der
  # Reportordner geht ihn erst recht nichts an. Trägt ein E-Mail-Entwurf
  # trotzdem einen Anhang, wird er fehlgeschlagen gebucht statt ohne die
  # Unterlage zugestellt (Begründung im Kopf von mail_dispatch.py).
  #
  # Ohne SMTP-Zugangsdaten in der .env beendet er sich beim Start mit einer
  # klaren Logzeile und Exit 0 — der Kanal ist dann gebaut, aber inert.
  sales-mail:
    build: ./sales-mcp
    image: sales-claw-sales-mcp:local
    container_name: sales-mail
    command: python mail_dispatch.py
    # Demo-Betrieb wie der restliche Stack. Bewusst "no": ein Dienst, der
    # Mails an echte Menschen schickt, startet nicht von selbst mit dem
    # Rechner mit.
    restart: unless-stopped
    # KEIN env_file — dieselbe T5a-Ueberlegung wie beim Agent-Container
    # (siehe dort, ausfuehrlich): sales-mail braucht die Kundendaten-DB und
    # die SMTP-Zugangsdaten, sonst nichts. Ueber env_file erbte er auch
    # OPENWA_API_KEY, APIFY_TOKEN, INBOX_WEBHOOK_SECRET und CALDAV_* — und
    # der fruehere Kommentar an dieser Stelle BEHAUPTETE die Trennung
    # („CALDAV_* liest der Werkzeugdienst, nicht dieser hier"), waehrend die
    # env_file-Zeile drei Zeilen darueber sie unterlief (Review-Befund H3).
    # Jetzt stellt die namentliche Liste sie her; die Werte kommen weiter
    # aus .env, ueber Compose-Interpolation der genannten Namen.
    environment:
      - SALES_DB_URL=${SALES_DB_URL}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORT=${SMTP_PASSWORT:-}
      - EMAIL_ABSENDER=${EMAIL_ABSENDER:-}
      - TZ=${TZ:-Europe/Berlin}
      # Schleifentakt explizit statt implizit per Default — wie beim
      # Dispatcher.
      - MAIL_INTERVAL_S=10
    # Ein laufender Versand darf nicht per SIGKILL zerrissen werden: der
    # Dienst beendet nach SIGTERM die laufende Runde (SMTP-Timeout 30 s) und
    # geht dann. 45 s Gnadenfrist decken das ab — dieselbe Rechnung wie bei
    # sales-dispatch.
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Der Versender fuer LinkedIn-BEITRAEGE (sales-mcp/linkedin_dispatch.py).
  # Er veroeffentlicht freigegebene Beitraege ueber die offizielle
  # LinkedIn-API auf dem Profil des Betreibers — Text, Bilder oder ein
  # Video, je nachdem, was am Entwurf haengt.
  #
  # Er fasst AUSSCHLIESSLICH `recipient='eigenes-profil'` an. LinkedIn-
  # DIREKTNACHRICHTEN an echte Menschen bleiben Handarbeit; die API kann
  # sie fuer Privatprofile nicht versenden, und ein Versender, der sie
  # dennoch griffe, stellte den Text einer privaten Ansprache oeffentlich
  # aufs Profil. Die Klausel steht deshalb im Claim selbst (Kopf von
  # linkedin_dispatch.py).
  #
  # DAUERDIENST seit 30.08.2026 (Betreiber: „freigabe soll gleich versand
  # machen"). Vorher lief er hinter einem Profil und nur mit genannter
  # Entwurfs-Kennung — die Lehre aus dem Doppelpost vom 26.08., als ein
  # Stapellauf einen laengst vergessenen freigegebenen Beitrag
  # veroeffentlichte.
  #
  # Diese Sorge ist nicht verschwunden, sie wird jetzt IM DIENST
  # abgefangen statt durch dessen Abwesenheit: hoechstens EIN Beitrag pro
  # Tag (Kadenz vom 27.08.) und nichts, was laenger als
  # LINKEDIN_FRISCHE_TAGE (7) freigegeben ist. Beides in
  # sales-mcp/tests/test_linkedin_dispatch.py eigens getestet.
  #
  # Handbetrieb bleibt und ignoriert die Kadenz bewusst — dort hat ein
  # Mensch GENAU diesen Beitrag gemeint:
  #   LINKEDIN_DRAFT_ID=<uuid> docker compose run --rm sales-linkedin
  sales-linkedin:
    build: ./sales-mcp
    image: sales-claw-sales-mcp:local
    container_name: sales-linkedin
    command: python linkedin_dispatch.py
    restart: unless-stopped
    # KEIN env_file — dieselbe Trennung wie bei sales-mail: dieser Dienst
    # braucht die Kundendaten-DB, das LinkedIn-Token und den Medienordner,
    # sonst nichts. Ueber env_file erbte er auch OPENWA_API_KEY, SMTP_*,
    # ANTHROPIC_API_KEY und CALDAV_* — Zugangsdaten, mit denen er nichts zu
    # tun hat.
    environment:
      - SALES_DB_URL=${SALES_DB_URL}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN:-}
      - LINKEDIN_PERSON_URN=${LINKEDIN_PERSON_URN:-}
      # Der Monatsstand der versionierten API LAEUFT AB (LinkedIn haelt rund
      # zwoelf Staende aktiv und antwortet danach mit HTTP 426). Deshalb
      # ueberschreibbar statt fest verdrahtet.
      - LINKEDIN_API_VERSION=${LINKEDIN_API_VERSION:-202608}
      - TZ=${TZ:-Europe/Berlin}
      # Die Kennung des EINEN Beitrags, der veroeffentlicht werden soll.
      # Ohne sie tut der Dienst nichts, ausser aufzulisten, was freigegeben
      # waere. Er ist kein Dauerlaeufer: er nimmt genau diesen Entwurf und
      # beendet sich. Begruendung im Kopf von linkedin_dispatch.py.
      #
      #   LINKEDIN_DRAFT_ID=<uuid> docker compose --profile linkedin       #     run --rm sales-linkedin
      - LINKEDIN_DRAFT_ID=${LINKEDIN_DRAFT_ID:-}
    volumes:
      # Read-only wie ueberall: was gepostet werden kann, legt ausschliesslich
      # ein Mensch auf dem Host ab.
      - ./media:/media:ro
      - ./media-erzeugt:/media-erzeugt:ro
    # Ein laufender Video-Upload darf nicht per SIGKILL zerrissen werden —
    # er laeuft abschnittweise und kann Minuten dauern (Upload-Timeout 300 s
    # je Abschnitt). Grosszuegiger als bei den Zwillingen, aus genau diesem
    # Grund. Wird er doch abgeschnitten, bleibt der Entwurf geclaimt liegen
    # und es steht nichts auf dem Profil — der sichere Ausgang.
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Die Antwort-Bruecke des Auto-Betriebs (sales-mcp/auto.py, Moduldocstring
  # dort): beantwortet unbeantwortete Kundennachrichten von Kontakten MIT
  # Kontakt-Freigabe selbst — Antwort per Anthropic-API erzeugen, Entwurf
  # mit status='approved' (approved_by='auto-betrieb') anlegen, zustellen
  # tut wie immer NUR sales-dispatch. Kein neuer Versandweg: dieser Dienst
  # spricht nie mit OpenWA, er schreibt nur drafts/activities.
  #
  # Bewusst "no" — anders als Dispatcher und Agent, die seit dem 26.08.2026
  # auf `unless-stopped` stehen: dieser Dienst ist ein ZWEITER Antwortpfad
  # neben dem Cron-Job `antworten-pruefen` im Agenten. Startete er mit dem
  # Rechner mit, entstuenden Antworten doppelt. Ohne ANTHROPIC_API_KEY beendet
  # er sich mit klarer Meldung, statt still nichts zu tun. EINE Instanz
  # genuegt; gegen versehentliche zweite sichert der Advisory-Lock je Lead.
  sales-auto:
    build: ./sales-mcp
    image: sales-claw-sales-mcp:local
    container_name: sales-auto
    command: python auto.py
    restart: "no"
    env_file:
      - .env
    environment:
      - SALES_DB_URL=${SALES_DB_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Dasselbe Primaermodell wie der Agent (config/openclaw.json).
      - AUTO_MODELL=${AUTO_MODELL:-claude-sonnet-5}
      # Sammelfenster: so alt muss die juengste Kundennachricht sein, bevor
      # geantwortet wird — mehrere schnelle Nachrichten bekommen EINE Antwort.
      - AUTO_SAMMELFENSTER_S=${AUTO_SAMMELFENSTER_S:-90}
      - AUTO_INTERVAL_S=20
      - TZ=${TZ:-Europe/Berlin}
    # Ein laufender Modellaufruf (Timeout 90 s) darf die Runde zu Ende
    # bringen; danach geht der Dienst. 120 s Gnadenfrist decken das ab.
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Die Freigabe-Oberflaeche (Stufe 10) — der siebte Container, und der
  # einzige mit einem Host-Port neben dem Gateway. Gleicher Build-Kontext und
  # gleiches Image wie sales-mcp, nur ein anderes Kommando (sales-mcp/ui.py).
  #
  # Lesen: Entwuerfe, Kontakte, Posteingang, Wiedervorlagen. Schreiben:
  # AUSSCHLIESSLICH die drei Freigabe-Uebergaenge mit den SQL-Bedingungen der
  # Chat-Werkzeuge (approved_by='betreiber-ui' als Audit-Unterschied) sowie —
  # seit 21.08.2026 — die Einordnung unbekannter Absender (/einordnung), und
  # zwar ueber die Werkzeuge server.eingang_einordnen()/kontakt_anlegen()
  # selbst, nicht mit eigenem SQL. Das Freigabe-Gate bleibt die Datenbank
  # (Grundsatzentscheidung 1) — dieses UI ist nur ein zweiter Bedienweg dafuer,
  # kein neuer Versandweg. Es fragt auch niemanden im Netz: absender_aufloesen
  # (GET an openwa, Rate-Limit-Budget) bleibt Chat-Sache.
  #
  # Sicherheitsmodell (ausfuehrlich im Kopf von ui.py):
  #   * Port NUR auf 127.0.0.1 — die Vertrauensgrenze ist der Rechner des
  #     Betreibers, wie beim Gateway-Port 18894. Im Container bindet der
  #     Dienst auf 0.0.0.0 (anders waere er durchs Portmapping nicht
  #     erreichbar); die Loopback-Grenze setzt DIESES Mapping. Nicht ins
  #     Internet stellen.
  #   * CSRF-Boot-Token und Host-Header-Pruefung im Dienst selbst — Loopback
  #     allein schuetzt nicht vor dem Browser des Betreibers (Details ui.py).
  #
  # "unless-stopped" statt des "no" der uebrigen Dienste — bewusst: dieses UI
  # versendet nichts und schreibt nur, was ein Mensch anklickt. Es darf nach
  # einem Neustart wieder da sein, ohne dass damit (wie bei Dispatcher oder
  # Agent) von selbst Nachrichten an echte Menschen moeglich wuerden.
  # sales-stt (01.09.2026) — Sprache zu Text, LOKAL.
  #
  # Eigenes Image: faster-whisper bringt 431 MB mit, und das
  # sales-mcp-Image steckt in sechs Diensten. Eigener Dienst statt
  # Einbau, damit sie alle schlank bleiben.
  #
  # KEIN env_file, KEINE Datenbank, KEINE Schluessel (T5a-Haltung wie bei
  # sales-ui): er bekommt Audio, gibt Text. Mehr kann er nicht.
  #
  # Das Modell (~300 MB) liegt im Volume und wird beim ERSTEN Auftrag
  # geladen — nicht beim Start. Ein Stack, in dem nie jemand eine
  # Sprachnachricht schickt, zahlt dafuer keinen Speicher.
  sales-stt:
    build: ./sales-stt
    image: sales-claw-sales-stt:local
    container_name: sales-stt
    restart: unless-stopped
    environment:
      - STT_PORT=2790
      - STT_MODELL=${STT_MODELL:-base}
      - STT_SPRACHE=${STT_SPRACHE:-de}
      - HF_HOME=/modelle
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - sales-stt-modelle:/modelle
    # Kein ports:-Eintrag — erreichbar ausschliesslich im Compose-Netz.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sales-ui:
    build: ./sales-mcp
    image: sales-claw-sales-mcp:local
    container_name: sales-ui
    command: python ui.py
    restart: unless-stopped
    # KEIN env_file — dieselbe T5a-Ueberlegung wie bei sales-claw und
    # sales-mail (siehe dort): das UI braucht die Kundendaten-DB, sonst
    # nichts. Ueber env_file erbte es OPENWA_API_KEY, APIFY_TOKEN,
    # INBOX_WEBHOOK_SECRET, SMTP_* und CALDAV_* — lauter Schluessel, mit
    # denen ein kompromittierter Web-Dienst das Gate umgehen koennte.
    environment:
      - SALES_DB_URL=${SALES_DB_URL}
      # Ausdruecklich 'sales', nicht interpoliert: die Oberflaeche zeigt und
      # schaltet die ECHTEN Entwuerfe. sales_test gehoert der Testsuite.
      - SALES_DB_SCHEMA=sales
      - TZ=${TZ:-Europe/Berlin}
      - UI_PORT=8791
      # Der Sammelkontakt „Unbekannte Eingaenge" — dieselbe Variable wie bei
      # sales-inbox, hier nur GELESEN. Ohne sie findet server._einzuordnende()
      # nichts und die Seite /einordnung (Stufe 11 in der Oberflaeche) bliebe
      # dauerhaft leer, ohne dass jemand merkt warum. Kein Geheimnis: eine
      # lead_id, die auf jeder Kontaktseite steht — die T5a-Ueberlegung oben
      # (keine Schluessel ins UI) bleibt davon unberuehrt.
      - INBOX_UNBEKANNT_LEAD_ID=${INBOX_UNBEKANNT_LEAD_ID:-}
      # WhatsApp-Zustand auf /whatsapp (29.08.2026). Bewusst NICHT der
      # OPENWA_API_KEY: der darf senden und wuerde das Freigabe-Gate
      # umgehen (T5a, ausfuehrlich beim Agent-Container). Der VIEWER-
      # Schluessel darf ausschliesslich lesen — gemessen am 29.08.2026:
      # GET /api/sessions -> 200, POST messages/send-text -> 403.
      # Fehlt er, zeigt die Seite eine Erklaerung statt eines Fehlers.
      - OPENWA_URL=http://openwa:2785
      - OPENWA_SESSION_ID=${OPENWA_SESSION_ID:-}
      - OPENWA_VIEWER_KEY=${OPENWA_VIEWER_KEY:-}
      # Adresse der OpenWA-Oberflaeche fuer den Verweis auf /whatsapp — der
      # Browser des Betreibers ruft sie auf, nicht der Container.
      - OPENWA_DASHBOARD_URL=${OPENWA_DASHBOARD_URL:-http://127.0.0.1:12785}
      # Zusaetzlich erlaubte Host-Header — die Tailscale-IP (Zugriff vom
      # Handy) und der ts.net-Name (hinter `tailscale serve`, F4: der Proxy
      # reicht den Original-Host durch). Leere Glieder filtert ui.py.
      - UI_EXTRA_HOSTS=${UI_TAILSCALE_IP:-},${UI_SERVE_HOST:-}
      # Anmeldung (E1, 31.08.2026): leer = Uebergangszustand (offen wie
      # bisher); gesetzt = Login Pflicht. Setzt deploy/benutzer-anlegen.sh.
      - UI_SESSION_SECRET=${UI_SESSION_SECRET:-}
      # Kalender (01.09.2026): der Tab /kalender liest die Termine des
      # Betreibers per CalDAV — REIN LESEND (ein REPORT-Aufruf, kein PUT).
      # Bewusste Ausnahme von der T5a-Liste oben: der Kalenderzugang
      # traegt KEINE Sendemacht (anders als OPENWA_API_KEY oder SMTP), und
      # das UI zeigt die Termine ohnehin schon aus der eigenen Datenbank.
      # Die Alternative — sales-mcp spiegelt den Kalender periodisch in
      # die DB — waere mehr Code fuer dasselbe Bild.
      - CALDAV_URL=${CALDAV_URL:-}
      - CALDAV_USER=${CALDAV_USER:-}
      - CALDAV_PASSWORT=${CALDAV_PASSWORT:-}
    volumes:
      # DER MEDIENORDNER — und hier OHNE `:ro`, als einziger Dienst im Stack.
      #
      # Das ist eine bewusste Aenderung an einem Grundsatz. Bisher war
      # `media/` ueberall read-only, mit der Begruendung: „was versendet
      # werden kann, legt ausschliesslich ein Mensch auf dem Host ab".
      # Seit dem Betreiber-Wunsch vom 25.08.2026 gibt es dafuer eine Seite
      # (/medien), und damit muss GENAU EIN Dienst schreiben duerfen.
      #
      # Der Grundsatz bleibt gewahrt, nur praeziser gefasst: es legt
      # weiterhin ausschliesslich ein MENSCH etwas ab — nur ueber eine
      # Seite hinter Host-Wache und CSRF-Marke statt ueber den
      # Datei-Explorer. Der AGENT bekommt kein Schreibrecht: sales-mcp und
      # sales-dispatch behalten `:ro`, und genau das ist der Punkt.
      - ./media:/media
      - ./media-erzeugt:/media-erzeugt:ro
    ports:
      # Loopback IMMER. Die zweite Zeile bindet den Port zusaetzlich an die
      # Tailscale-Adresse dieses Rechners — ausdruecklich NICHT an 0.0.0.0:
      # die Oberflaeche kennt keine Anmeldung, im normalen WLAN stuende sie
      # jedem Geraet offen. Ueber Tailscale kommt nur heran, wer im privaten
      # Netz des Betreibers angemeldet ist.
      #
      # FALLE: laeuft Tailscale nicht, existiert die Adresse nicht und der
      # Container startet mit „cannot assign requested address" NICHT. Das ist
      # gewollt — lieber eine Oberflaeche, die fehlt, als eine, die im
      # falschen Netz haengt. Ohne gesetzte UI_TAILSCALE_IP faellt die Zeile
      # auf Loopback zurueck und ist damit wirkungslos (doppeltes Mapping
      # derselben Adresse ist erlaubt).
      - "127.0.0.1:8791:8791"
      - "${UI_TAILSCALE_IP:-127.0.0.1}:8791:8791"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Explizite name:-Angabe, sonst prefixt Compose mit dem Projektnamen
  # (hier "sales-claw" -> "sales-claw_sales-claw-state"), was den in den
  # Randbedingungen geforderten literalen Volume-Namen verfehlt.
  sales-claw-state:
    name: sales-claw-state
  sales-claw-keys:
    name: sales-claw-keys
  # Sprachnachrichten und das Whisper-Modell (01.09.2026). Getrennt, weil
  # das eine Kundeninhalt ist (gehoert in die Sicherung) und das andere
  # ein 300-MB-Download, der jederzeit neu geholt werden kann.
  sales-sprachnachrichten:
    name: sales-sprachnachrichten
  sales-stt-modelle:
    name: sales-stt-modelle
