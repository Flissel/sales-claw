# Lokaler Betrieb auf Docker Desktop. Für die Proxmox-VM zusätzlich
# docker-compose.proxmox.yml als Override verwenden (siehe docs/07).
#
# Projektname explizit gepinnt (Stufe 3, T3). Er war bisher implizit vom
# Verzeichnisnamen abgeleitet — und genau daran hängt mehr, als man sieht:
# docker-compose.openwa.yml liegt im selben Verzeichnis und bekommt damit
# denselben Projektnamen, also auch dasselbe Default-Netz
# "sales-claw_default". Gemessen (docker inspect): openwa, sales-mcp und
# sales-claw hängen alle dort, openwa ist unter dem DNS-Namen `openwa`
# erreichbar. Deshalb braucht der Dispatcher KEIN zusätzliches externes Netz
# — und niemand muss dafür einen laufenden Container neu erzeugen. Würde das
# Verzeichnis umbenannt, fiele diese Kopplung stillschweigend auseinander;
# der explizite Name hier und in docker-compose.openwa.yml hält sie fest.
name: sales-claw

services:
  sales-claw:
    image: ghcr.io/openclaw/openclaw:2026.7.1-slim
    container_name: sales-claw
    # DEMO-BETRIEB: bewusst "no", nicht "unless-stopped".
    #
    # Der Container hängt an der persönlichen WhatsApp-Nummer des Betreibers
    # und `channels.whatsapp.selfChatMode` steht auf true — er beantwortet
    # also jede Nachricht, die der Betreiber sich selbst schreibt. Das ist für
    # die Vorführung gewollt, im Alltag aber unerwünscht: der Selbst-Chat
    # dient vielen als Notizzettel, und jede Notiz bekäme eine Antwort.
    #
    # Mit "no" läuft der Container nur, solange er ausdrücklich gestartet
    # wurde, und ist nach einem Neustart des Rechners wieder aus.
    #
    # Auf "unless-stopped" umstellen, sobald sales-claw eine eigene Nummer hat
    # und dauerhaft bedienen soll. Voraussetzung dafür bleibt, dass der
    # Anmelde-Trigger der Windows-Aufgabe \OpenClaw Gateway deaktiviert ist
    # (aktuell: Enabled=False) — sonst kämen bei einer Anmeldung zwei
    # Baileys-Sitzungen auf denselben Credentials hoch.
    restart: "no"
    # KEIN env_file: .env — bewusst, und bewusst nicht bequem (Stufe 3, T5a).
    #
    # `.env` enthält OPENWA_API_KEY und SALES_DB_URL. Über `env_file: .env`
    # erbte der Agent-Container beide, obwohl er beide nicht braucht: er
    # versendet nichts (das tut ausschliesslich sales-dispatch) und spricht
    # die Datenbank nur über sales-mcp an. Geerbt bekam er damit die
    # Fähigkeit, das Freigabe-Gate zu umgehen — ein `curl` gegen OpenWA
    # sendet WhatsApp-Nachrichten ohne jeden Umweg über `drafts`, ein `psql`
    # mit der DSN setzt `status='approved'` selbst. Das Gate soll die
    # Datenbank sein (Grundsatzentscheidung 1); mit den Schlüsseln im
    # Agent-Container ist es nur noch so stark wie die Exec-Freigabeliste des
    # Gateways. Eine Zeitbombe, weil sie erst beim nächsten regulären
    # Recreate scharf wird — der laufende Container hat die Variablen aus
    # seinem Erzeugungszeitpunkt, sichtbar wird die Änderung also erst dann.
    #
    # Deshalb hier eine ausdrückliche Liste statt einer Vererbung: was der
    # Agent braucht, steht namentlich da. Kommt etwas dazu, muss es jemand
    # hinschreiben — und dabei kurz überlegen, ob es hier hingehört.
    # Die Werte kommen weiterhin aus `.env`, aber über Compose-Interpolation
    # (`${...}`), die nur die genannten Namen auflöst.
    #
    # sales-mcp und sales-dispatch behalten `env_file: .env`: sie SIND die
    # Vertrauensdomäne für diese Geheimnisse — der eine hält die Kundendaten-DB,
    # der andere ist die einzige Komponente, die versenden darf.
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TZ=${TZ:-Europe/Berlin}
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
    volumes:
      - sales-claw-state:/home/node/.openclaw
      - sales-claw-keys:/home/node/.config/openclaw
    ports:
      # Nur Loopback. Der Gateway hält WhatsApp-Session und Modellschlüssel.
      - "127.0.0.1:18894:18894"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "openclaw", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  sales-mcp:
    build: ./sales-mcp
    # Expliziter Tag statt des impliziten "sales-claw-sales-mcp": sales-dispatch
    # unten faehrt DASSELBE Image (siehe dort). Damit genuegt weiterhin ein
    # `docker compose build sales-mcp`, um beide Dienste aktuell zu halten.
    image: sales-claw-sales-mcp:local
    container_name: sales-mcp
    # Wie sales-claw im Demo-Betrieb: laeuft nur nach ausdruecklichem Start.
    restart: "no"
    env_file:
      - .env
    # Der Medienordner (Stufe 4, F4). Hier liegen die Unterlagen, die der
    # Betreiber an Entwürfe hängen kann; `medien_liste` liest genau dieses
    # Verzeichnis und `entwurf_erstellen` prüft eine Datei gegen es, bevor ein
    # Entwurf entsteht.
    #
    # `:ro` ist nicht Vorsicht, sondern Aussage: weder Werkzeugdienst noch
    # Dispatcher haben je einen Grund, in diesen Ordner zu schreiben. Was
    # versendet werden kann, legt ausschliesslich ein Mensch auf dem Host ab.
    # Ein Host-Bind statt eines benannten Volumes, weil genau das der Weg ist,
    # auf dem der Betreiber Dateien hineinbekommt (Datei-Explorer, nicht
    # `docker cp`).
    #
    # Der Reportordner (Stufe 5, R1) — und das einzige beschreibbare Bind im
    # ganzen Stack. `marktanalyse` legt hier ihre Markdown-Reports ab
    # (/reports/<thema>-<region>-<datum>.md).
    #
    # Warum überhaupt auf den Host und nicht in ein benanntes Volume: der
    # Report ist ein Arbeitsergebnis für einen Menschen. Er soll ihn im
    # Datei-Explorer öffnen, per Mail weiterreichen und aufheben können, ohne
    # `docker cp` zu lernen. Und er muss den Neustart eines Prototyp-Containers
    # überleben, für den `restart: "no"` gilt.
    #
    # Warum NUR an sales-mcp und warum schreibbar: nur der Werkzeugdienst
    # erzeugt Reports. Dispatcher und Inbox haben hier nichts zu suchen — der
    # eine versendet, der andere nimmt entgegen; ein Schreibrecht, das niemand
    # braucht, wird auch nicht vergeben. Der Medienordner darüber bleibt
    # unverändert `:ro`: was rausgehen kann, legt ausschliesslich ein Mensch ab
    # (Begründung dort) — die beiden Ordner haben genau gegenläufige
    # Datenrichtungen und deshalb gegenläufige Rechte.
    volumes:
      - ./media:/media:ro
      - ./reports:/reports
    # Kein ports:-Eintrag — nur im Compose-Netz erreichbar. Der Dienst kennt
    # die Kundendaten-DB; er hat auf dem Host nichts verloren.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Der Dispatcher — die einzige Komponente, die tatsaechlich versendet.
  # Gleicher Build-Kontext und gleiches Image wie sales-mcp, nur ein anderes
  # Kommando: er teilt sich mit server.py Pool, Query-Helfer und die
  # Schema-Whitelist (sales-mcp/dispatch.py).
  #
  # Er liest ausschliesslich drafts(status='approved', channel='whatsapp').
  # Das Freigabe-Gate ist die Datenbank, nicht das Verhalten eines Modells
  # (Grundsatzentscheidung 1); LinkedIn fasst er nie an (Nr. 3).
  sales-dispatch:
    build: ./sales-mcp
    image: sales-claw-sales-mcp:local
    container_name: sales-dispatch
    command: python dispatch.py
    # Demo-Betrieb wie der restliche Stack. Bewusst "no": ein Dienst, der
    # Nachrichten an echte Menschen schickt, startet nicht von selbst mit dem
    # Rechner mit.
    restart: "no"
    env_file:
      - .env
    environment:
      # openwa laeuft aus docker-compose.openwa.yml — dank gepinntem
      # Projektnamen (oben) im selben Netz und unter diesem DNS-Namen
      # erreichbar. Gemessen aus einem Container dieses Netzes:
      # GET http://openwa:2785/api/health/ready -> 200, /api/sessions ohne
      # Key -> 401.
      - OPENWA_URL=http://openwa:2785
      # Schleifentakt aus dem Plan (T3), explizit statt implizit per Default.
      - DISPATCH_INTERVAL_S=10
      # OPENWA_SESSION_ID und OPENWA_API_KEY kommen aus .env.
    # Derselbe Medienordner wie an sales-mcp, ebenfalls read-only (Begründung
    # dort). Der Dispatcher liest eine angehängte Datei unmittelbar vor dem
    # Senden erneut — sie kann seit der Freigabe verschwunden sein, und dann
    # scheitert der Entwurf, statt ohne Anhang rauszugehen.
    volumes:
      - ./media:/media:ro
    # Ein laufender Versand darf nicht per SIGKILL zerrissen werden: der
    # Dispatcher beendet nach SIGTERM die laufende Runde (HTTP-Timeout 30 s)
    # und geht dann. 45 s Gnadenfrist decken das ab.
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Der Eingang (Stufe 4, F1) — die Gegenrichtung des Dispatchers: OpenWA
  # stellt hier `message.received` der Session `sales` zu, jede angenommene
  # Nachricht wird zu einer `activities`-Zeile vom Typ `kundenantwort`.
  # Gleicher Build-Kontext und gleiches Image wie sales-mcp, nur ein anderes
  # Kommando (sales-mcp/inbox.py).
  #
  # Er ist der ERSTE von aussen erreichbare Endpunkt dieses Systems. Deshalb:
  #   * Jede Anfrage wird per HMAC-SHA256 gegen INBOX_WEBHOOK_SECRET geprueft,
  #     BEVOR irgendetwas geparst oder geschrieben wird (gemessenes Verfahren:
  #     openwa/upstream/src/modules/webhook/webhook-delivery.service.ts,
  #     Header `X-OpenWA-Signature`, Wert `sha256=<hex>` ueber den rohen Rumpf).
  #     Ohne gesetztes Geheimnis startet der Dienst nicht.
  #   * KEIN ports:-Eintrag. Erreichbar ist er ausschliesslich im Compose-Netz
  #     unter http://sales-inbox:8790/webhook — auf dem Host hat ein Endpunkt,
  #     der in die Kundendatenbank schreibt, nichts verloren.
  #   * Er versendet nichts und aendert keine `drafts`. Das Freigabe-Gate
  #     (Grundsatzentscheidung 1) bleibt unberuehrt.
  sales-inbox:
    build: ./sales-mcp
    image: sales-claw-sales-mcp:local
    container_name: sales-inbox
    command: python inbox.py
    # Demo-Betrieb wie der restliche Stack.
    restart: "no"
    env_file:
      - .env
    environment:
      # Port im Compose-Netz, explizit statt implizit per Default.
      - INBOX_PORT=8790
      # INBOX_WEBHOOK_SECRET und INBOX_UNBEKANNT_LEAD_ID kommen aus .env.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Explizite name:-Angabe, sonst prefixt Compose mit dem Projektnamen
  # (hier "sales-claw" -> "sales-claw_sales-claw-state"), was den in den
  # Randbedingungen geforderten literalen Volume-Namen verfehlt.
  sales-claw-state:
    name: sales-claw-state
  sales-claw-keys:
    name: sales-claw-keys
