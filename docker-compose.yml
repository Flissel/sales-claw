# Lokaler Betrieb auf Docker Desktop. Für die Proxmox-VM zusätzlich
# docker-compose.proxmox.yml als Override verwenden (siehe docs/07).
services:
  sales-claw:
    image: ghcr.io/openclaw/openclaw:2026.7.1-slim
    container_name: sales-claw
    # VORÜBERGEHEND "no" statt "unless-stopped".
    #
    # Grund: Die Windows-Aufgabe \OpenClaw Gateway hat einen aktiven
    # Anmelde-Trigger und startet den lokalen Gateway bei jeder Anmeldung auf
    # denselben WhatsApp-Credentials, die inzwischen auch in diesem Volume
    # liegen. Mit "unless-stopped" käme bei einer Anmeldung zusätzlich dieser
    # Container hoch — zwei gleichzeitige Baileys-Sitzungen melden das
    # verknüpfte Gerät ab. Eine "prüfe vor dem Start"-Anweisung im Runbook
    # hilft dagegen nicht, weil beide Starts automatisch erfolgen.
    #
    # ZURÜCKSETZEN auf "unless-stopped", sobald der Anmelde-Trigger
    # deaktiviert ist (braucht Administratorrechte):
    #   $t = Get-ScheduledTask -TaskName 'OpenClaw Gateway'
    #   foreach ($tr in $t.Triggers) { $tr.Enabled = $false }
    #   Set-ScheduledTask -TaskName 'OpenClaw Gateway' -Trigger $t.Triggers
    restart: "no"
    env_file:
      - .env
    environment:
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
    volumes:
      - sales-claw-state:/home/node/.openclaw
      - sales-claw-keys:/home/node/.config/openclaw
    ports:
      # Nur Loopback. Der Gateway hält WhatsApp-Session und Modellschlüssel.
      - "127.0.0.1:18894:18894"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "openclaw", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  # Explizite name:-Angabe, sonst prefixt Compose mit dem Projektnamen
  # (hier "sales-claw" -> "sales-claw_sales-claw-state"), was den in den
  # Randbedingungen geforderten literalen Volume-Namen verfehlt.
  sales-claw-state:
    name: sales-claw-state
  sales-claw-keys:
    name: sales-claw-keys
