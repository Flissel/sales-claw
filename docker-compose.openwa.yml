# OpenWA (Stufe 3, T1) — eigenes Compose-File, getrennt vom Haupt-Stack
# (docker-compose.yml), damit Upstream-Updates trivial bleiben: `openwa/upstream`
# ist ein flacher, gitignorierter Klon von https://github.com/rmyndharis/OpenWA;
# nur diese Datei hier ist versioniert.
#
# Start: docker compose -f docker-compose.openwa.yml up -d --build
#
# Grundsatzentscheidungen (siehe docs/superpowers/plans/2026-08-18-sales-claw-stufe3-versand.md):
#   1. Kein MCP: MCP_ENABLED bleibt ungesetzt. Nur der Dispatcher (T3) sendet,
#      und der liest ausschliesslich drafts.status='approved'.
#   2. Diese Instanz wird NIE mit der persoenlichen Nummer des Betreibers
#      gepairt. Bis zum QR-Scan (Betreiber-Aktion, nicht Teil dieses Laufs)
#      ist "Session nicht verbunden" der erwartete Normalzustand.
#   4. Engine whatsapp-web.js (laut OpenWA-Doku/Capability-Matrix das
#      ausgereiftere, sperr-risikoaermere Engine der beiden). Rate-Limiter an.
#      Docker-Socket-Proxy bewusst NICHT uebernommen — deren README/SECURITY.md
#      beschreiben das Weglassen des `docker-proxy`-Dienstes als vorgesehenen
#      Weg, wenn die eingebaute Container-Orchestrierung (Dashboard >
#      Infrastructure) nicht genutzt wird; ohne DOCKER_HOST-Var und ohne
#      gemountetes Docker-Socket meldet DockerService "Docker unavailable"
#      und degradiert kontrolliert, statt zu crashen.
#
# Projektname explizit gepinnt (Stufe 3, T3) — identisch zu docker-compose.yml.
# Beide Dateien liegen im selben Verzeichnis und teilten sich den impliziten,
# vom Verzeichnisnamen abgeleiteten Projektnamen bereits; damit auch das
# Default-Netz "sales-claw_default", in dem `openwa` unter genau diesem
# DNS-Namen erreichbar ist. Der Dispatcher (Dienst sales-dispatch in
# docker-compose.yml) nutzt das. Der explizite Name haelt die Kopplung fest,
# statt sie vom Verzeichnisnamen abhaengig zu lassen.
name: sales-claw

services:
  openwa:
    build:
      context: ./openwa/upstream
      dockerfile: Dockerfile
    container_name: openwa
    # Anders als der uebrige Stack: startet nach einem Reboot von selbst.
    # Grund (Betreiber am 26.08.2026): openwa haelt die WhatsApp-Anmeldung.
    # Kommt der Container nicht hoch, verfaellt sie und muss per QR neu
    # gescannt werden — das braucht ein Handy und damit einen Menschen.
    # Gemessen am 26.08.2026: nach dem Reboot stand die Session auf `failed`,
    # nach dem Containerstart auf `qr_ready` — die Anmeldung war weg.
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      - NODE_ENV=production
      - PORT=2785
      # --- Datenbank: SQLite (gemessen aus openwa/upstream/.env.example und
      # .env.minimal — DATABASE_TYPE=sqlite ist der Zero-Config-Pfad; keine
      # externe Postgres-Instanz noetig). DATABASE_SYNCHRONIZE bleibt bewusst
      # ungesetzt (Default false): app.module.ts setzt fuer SQLite dann
      # migrationsRun=true, die Data-DB-Tabellen entstehen also ueber
      # TypeORM-Migrationen statt Auto-Sync — das ist der von .env.example
      # empfohlene Produktionspfad ("Set false in production!"), nicht der
      # Dev-Pfad aus .env.minimal. Die main-DB (api_keys/audit_logs) synced
      # weiterhin per Default (MAIN_DATABASE_SYNCHRONIZE default true), das
      # ist der dokumentierte Zero-Config-Erststart fuer den Auth-Teil.
      - DATABASE_TYPE=sqlite
      # --- Engine: whatsapp-web.js (Grundsatzentscheidung 4).
      - ENGINE_TYPE=whatsapp-web.js
      # Produktionsbetrieb (Betreiber am 26.08.2026): die Session startet mit
      # dem Container. Ohne das kaeme openwa nach einem Reboot zwar hoch, die
      # WhatsApp-Verbindung bliebe aber aus, bis jemand sie von Hand startet.
      - AUTO_START_SESSIONS=true
      # Einbettung des Dashboards in sales-ui (02.09.2026): zusaetzliche
      # Origins fuer CSP frame-ancestors, leerzeichengetrennt — bei uns die
      # HTTPS-Adresse von sales-ui. Leer = wie upstream ('self'). Braucht
      # deploy/openwa-patches/0002-dashboard-embed.patch im Image.
      - DASHBOARD_FRAME_ANCESTORS=${DASHBOARD_FRAME_ANCESTORS:-}
      # --- Rate-Limiter an (Grundsatzentscheidung 4). Die "medium"-Stufe ist
      # laut .env.example die auf der API tatsaechlich erzwungene; Werte hier
      # explizit gesetzt (== Anwendungsdefault) um die Entscheidung sichtbar
      # zu machen statt sie implizit dem Default zu ueberlassen.
      - RATE_LIMIT_MEDIUM_TTL=60000
      - RATE_LIMIT_MEDIUM_LIMIT=100
      # --- API-Key: API_MASTER_KEY bleibt ABSICHTLICH ungesetzt. Gemessener
      # Provisionierungsweg (openwa/upstream/docs/06-api-specification.md
      # §"API-Key Lifecycle" + .env.example "SECURITY"-Abschnitt): OpenWA
      # generiert beim allerersten Boot automatisch einen kryptographisch
      # zufaelligen Admin-Key, schreibt ihn nach /app/data/.api-key (Volume,
      # siehe unten) und gibt ihn einmalig im Startup-Log aus. Kein manuelles
      # Anlegen noetig.
      # --- SSRF-Ausnahme fuer den EIGENEN Webhook-Empfaenger (Stufe 4, F1).
      #
      # NICHT AKTIV IM LAUFENDEN CONTAINER. Diese Zeile wirkt erst beim
      # naechsten bewussten Recreate von openwa; im F1-Lauf wurde openwa
      # ausdruecklich nicht neu gestartet.
      #
      # Gemessen (src/common/security/ssrf-guard.ts + webhook.service.ts
      # validateWebhookUrl): OpenWA prueft die Webhook-URL schon BEI DER
      # REGISTRIERUNG gegen einen SSRF-Blocklist-Filter und weist alles ab,
      # was auf eine private Adresse aufloest — 10/8, 127/8, 172.16/12,
      # 192.168/16 und mehr. Das Compose-Netz dieses Projekts liegt auf
      # 192.168.144.0/20, `sales-inbox` also mittendrin. Belegt: POST
      # /api/sessions/{id}/webhooks mit http://sales-inbox:8790/webhook ->
      # 400 {"message":"Destination address is not allowed"}. Das ist kein
      # Fehler von OpenWA, sondern genau der Schutz, den man will — er kennt
      # nur eine vorgesehene Ausnahme: SSRF_ALLOWED_HOSTS, eine
      # kommagetrennte Liste von Hostnamen, die den Block umgehen duerfen
      # (die Doku nennt ausdruecklich den Fall "a sidecar webhook receiver").
      # WEBHOOK_SSRF_PROTECT=false waere die grobe Variante und bleibt aus:
      # sie haebe den Schutz fuer JEDES Ziel auf.
      #
      # Nach dem Recreate muss der Webhook einmal registriert werden (siehe
      # docs/03_RUNBOOK.md, Abschnitt „Eingehende Kundenantworten").
      - SSRF_ALLOWED_HOSTS=sales-inbox
      # --- LID-Aufloesung in der Eingangsrichtung (Stufe 11, T2).
      #
      # NICHT AKTIV IM LAUFENDEN CONTAINER — wie SSRF_ALLOWED_HOSTS wirkt
      # diese Zeile erst beim naechsten bewussten Recreate von openwa. Das ist
      # Betreiber-Sache: ein Recreate faehrt die WhatsApp-Session kurz runter,
      # und `--remove-orphans` ist in diesem Compose-Projekt TABU.
      #
      # Was es tut: OpenWA loest bei EINGEHENDEN Nachrichten die `@lid` auf
      # und legt die Rufnummer als `senderPhone` in die Webhook-Nutzlast
      # (gemessen: message-projector.service.ts, `!fromMe`-Zweig). Genau das
      # ist Stufe 1 der Reihenfolge in sales-mcp/inbox.py.
      #
      # Der frueher notierte Einwand — das Flag loese NUR die Eingangsrichtung
      # auf und zerlege damit die absenderscharfe Beantwortet-Pruefung
      # (Review-Befund M1, docs/03_RUNBOOK.md) — ist mit Stufe 11 erledigt:
      # die Ausgangsrichtung laeuft ueber dieselbe gespeicherte Zuordnung
      # (server.lid_telefon), und die Pruefung normalisiert beide Seiten
      # vorher (server._kanon). Ohne diese Stufe waere der Flag-Flip ein
      # Rueckschritt gewesen; mit ihr ist er der vorgesehene Weg.
      - RESOLVE_LID_TO_PHONE=true
      # --- Kein MCP_ENABLED-Eintrag (Grundsatzentscheidung 1 — Var bleibt
      # ungesetzt, nicht nur "false").
      # --- Kein DOCKER_HOST — Docker-Socket-Proxy von OpenWA bewusst nicht
      # uebernommen (siehe Kommentar oben).
    volumes:
      - openwa-data:/app/data
    ports:
      # Nur Loopback. Dashboard/API tragen den API-Key und (nach Pairing)
      # WhatsApp-Sessiondaten.
      # HOST-Port 12785, Container-Port bleibt 2785.
      #
      # GEMESSEN 25.08.2026: Windows hatte den TCP-Bereich 2701-2800
      # reserviert (Hyper-V/WSL, `netsh interface ipv4 show
      # excludedportrange protocol=tcp`). Docker konnte 2785 deshalb
      # nicht binden — "a socket in a way forbidden by its access
      # permissions" — obwohl NIEMAND darauf lauschte. Solche Bereiche
      # verschieben sich nach jedem Neustart; genau daran ist der
      # Gateway nach einem Rechnerneustart haengengeblieben.
      #
      # Die Dienste sind davon nicht betroffen: sie sprechen openwa
      # ueber den Containernamen an (OPENWA_URL=http://openwa:2785),
      # also am Host vorbei. Diese Bindung ist ausschliesslich fuer
      # den Menschen da — Dashboard und QR-Kopplung.
      - "127.0.0.1:12785:2785"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Selbe Prüfung wie in openwa/upstream/docker-compose.yml (openwa-api-
      # Dienst): node statt curl, weil das image kein curl garantiert.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:2785/api/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  # Expliziter name:, sonst prefixt Compose mit dem Projektnamen (vgl.
  # docker-compose.yml).
  openwa-data:
    name: openwa-data
