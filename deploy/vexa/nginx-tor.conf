# Tor-Dienst vexa-tor (deploy/vexa/docker-compose.yml): reicht NUR Port 8056 an
# das Gateway von vexa-lite weiter. Von sales-claw aus als http://vexa-lite:8056
# erreichbar (Netz-Alias in sales-claw_default). Bewusst ohne Zugriffslog: die
# Anfragen tragen API-Schluessel.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    # Verbindungs-Upgrade (WebSocket /ws des Gateways) durchreichen.
    map $http_upgrade $verbindung {
        default upgrade;
        ""      close;
    }

    # Dockers eingebauter DNS: vexa-gateway wird je Anfrage aufgeloest, nginx
    # startet also auch, wenn vexa-lite gerade neu erzeugt wird. Der Name
    # vexa-gateway ist ein Alias von vexa-lite NUR in vexa_default; der Name
    # vexa-lite selbst waere in sales-claw_default der Alias dieses Tors
    # (Schleife auf sich selbst), darum nie als Ziel verwenden.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8056;

        client_max_body_size 1m;

        location / {
            set $ziel http://vexa-gateway:8056;
            proxy_pass $ziel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $verbindung;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;
        }
    }
}
